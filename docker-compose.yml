services:
  fastfunnel:
    build: .
    command: ["uv", "run", "--no-sync", "python", "-m", "fastfunnel.app"]
    ports:
      - "5005:5005"
    env_file:
      - path: .env
        required: false
    volumes:
      - fastfunnel-data:/app/data
  worker:
    build: .
    command: ["uv", "run", "--no-sync", "python", "-m", "fastfunnel.worker"]
    env_file:
      - path: .env
        required: false
    volumes:
      - fastfunnel-data:/app/data

volumes:
  fastfunnel-data:
